<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
</head>
<style>
    h1 {
        text-align: center;
        text-decoration: underline;
        text-transform: uppercase;
        font-family: Arial, sans-serif;
        font-size: 36px;
        font-weight: bold;
        font-style: italic;
        border-width: 4px;
        border-style: double;
        border-radius: 10px;
    }
    h2 {
        text-align: left;
        text-decoration: overline;
        text-transform: capitalize;
        font-family: 'Times New Roman', serif;
        font-size: 28px;
        font-weight: normal;
        font-style: normal;
        border-width: 2px;
        border-style: solid;
        border-radius: 30px;
    }
    p {
        text-align: right;
        text-decoration: line-through;
        text-transform: lowercase;
        font-family: Verdana, sans-serif;
        font-size: 18px;
        font-weight: lighter;
        font-style: oblique;
        border-width: 3px;
        border-style: dotted;
        border-radius: 20px;
    }
</style>
<body>
    <h1> Welcome to my Website</h1>
    
    <p>This is my first HTML page.</p>

    <h2>About Me</h2>
    <p>Hello! I am learning HTML.</p>

    <h2>My Hobbies</h2>
    <ul>
        <li>Reading</li>
        <li>Music</li>
        <li>Gaming</li>
    </ul>

    <a href="https://www.google.com">Visit Google</a>

</body>
</html>
