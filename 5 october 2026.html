
<!DOCTYPE html>
<html>
<head>
    <title>My Courses</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
        }

        .course {
            display: inline-block;
            background-color: white;
            width: 250px;
            height: 180px;
            border: solid darkblue 2px;
            border-radius: 10px;
            margin: 10px;
            padding: 20px;
        }

        h2 {
            color: darkblue;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 50px;
        }

        p {
            color: gray;
        }
    </style>
</head>

<body>

    <h1>MY COURSES</h1>

    <div class="course">
        <h2>HTML</h2>
        <p>Learn the basics of HTML and<br>make your first webpage.</p>
        <button>Start Course</button>
    </div>

    <div class="course">
        <h2>CSS</h2>
        <p>Learn colors, fonts, borders and<br>beautiful webpage styling.</p>
        <button>Start Course</button>
    </div>

    <div class="course">
        <h2>JavaScript</h2>
        <p>Learn JavaScript and make your<br>webpages interactive.</p>
        <button>Start Course</button>
    </div>
    <p>Learn Web Development</p>

</body>
</html>
