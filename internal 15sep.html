<html>
    <head>
        <!-- The style tag is used to write css -->
        <style>
            /* h1 is the selector - it selects the heading */
            h1 {
                /* color and text-align are the properties of css */
                color: blue;
                
            }/* end of h1 css rule*/
        </style>
    </head>
    <body>
        <!-- This is the HTML heading -->
        <h1>Hello Students</h1>
    </body>
</html>
