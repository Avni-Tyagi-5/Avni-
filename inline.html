<!-- Inline css is written inside the HTML tag -->
 <h1 style="color:rgba(0, 255, 119, 0.884); text-align:center;">Welcome to my Website</h1>
 <!-- 
 <h1> -> Heading
    style -> Used to add CSS directly inside HTML
    color -> Sets the text color , css property
    blue -> Value of the color property
    text-align -> Aligns the text -->
