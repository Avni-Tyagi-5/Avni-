<!DOCTYPE html>
<html>
    <head>
        <title>Interaction using JavaScript</title>
        
    </head>
    <body>
        <h1>Javascript syntax examples</h1>
        <script>
            console.log("Hello World");
            console.log("This is my first JavaScript code");
            console.log(20);
            let name = "Avni Tyagi";
            age = 18;

            const pi = 3.14;

            var sum = 10+20;
            console.log("Name : " ,name);
            console.log("Age : " ,age);
            console.log("Pi : " ,pi);
            console.log("Sum : " ,sum);

            let student = {
                // name is a key and "Avni Tyagi" is its value
                name : "Avni Tyagi",
                // age is a key and 18 is its value
                age : 18,
                // course is a key and "CSE" is its value
                course : "CSE"
            };

            // Display the complete student object
            console.log("Student : " ,student);


            // An array stores multiple values in an ordered list.

            let fruits = ["Apple", "Banana", "Mango", "Grapes"];
            // Display the complete fruits array
            console.log("Fruits : " ,fruits);

            // Array positions start from 0.
            // 0 = apple, 1 = banana, 2 = mango, 3 = grapes

            console.log("First fruit : " ,fruits[0]);
            console.log("Second fruit : " ,fruits[1]); 
            console.log("Third fruit : " ,fruits[2]);


            console.log("age === 18 : " ,age === 18);
            console.log("age != 18 : " ,age != 18);
            console.log("age !== 18 : " ,age !== 18);
            console.log("age > 18 : " ,age > 18);
            console.log("age < 18 : " ,age < 18);
            console.log("age >= 18 : " ,age >= 18);
            console.log("age <= 18 : " ,age <= 18);
            console.log("age == 18 : " ,age == 18);

            console.log(5 == "5"); // true because the value is same
            console.log(5 === "5"); // false because the value and type are different

        </script>
    </body>
</html>
